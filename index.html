<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday Laiba 💕</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

<!-- Background Music -->
<audio id="backgroundMusic" src="song.mp3" loop></audio>
    <!-- Floating decorations -->

    <div id="floatingElements"></div>


    <!-- Intro Screen -->

    <section
        class="intro-screen"
        id="introScreen"
    >

        <div class="intro-card">

            <div class="gift">🎁</div>

            <div class="sparkles">
                ✨ 💕 🌸 🎀 ✨
            </div>

            <h1>A Special Surprise</h1>

            <h2>For You 💗</h2>

            <p>
                A little magical birthday book
                is waiting for you...
            </p>

            <button id="openBtn">
                Open Your Surprise 📖💕
            </button>

        </div>

    </section>



    <!-- Main Book -->

    <main
        class="main-container"
        id="mainContainer"
    >

        <h1 class="main-title">
            Happy Birthday My Muhtarma 🎀
        </h1>


        <div class="book-scene">


            <div
                class="book"
                id="book"
            >


                <!-- Left side background -->

                <div
                    class="book-half left-half"
                >
                </div>


                <!-- Right side background -->

                <div
                    class="book-half right-half"
                >
                </div>


                <!-- Real sheets are generated here -->

                <div
                    id="sheetsContainer"
                >
                </div>


                <!-- Center binding -->

                <div class="book-spine"></div>


            </div>


        </div>



        <!-- Controls -->

        <div class="controls">

            <button
                class="control-btn"
                id="prevBtn"
            >
                ← Previous
            </button>


            <div
                class="page-counter"
                id="pageCounter"
            >
                Page 1 of 40
            </div>


            <button
                class="control-btn"
                id="nextBtn"
            >
                Next →
            </button>

        </div>


        <p class="instruction">
            💕 Turn the pages using the buttons or arrow keys 💕
        </p>


    </main>


    <script src="script.js"></script>

</body>
</html>
